<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR Generator Settings</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #1f2328;
      background: #fff;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 12px;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #d1d9e0;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: monospace;
    }
    input:focus {
      outline: none;
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
    }
    .save-btn {
      display: block;
      width: 100%;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: #2da44e;
      border: 1px solid rgba(27, 31, 36, 0.15);
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }
    .save-btn:hover {
      background: #218c36;
    }
    .saved-msg {
      display: none;
      margin-top: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #1a7f37;
      background: #dafbe1;
      border-radius: 6px;
    }
    .saved-msg.show {
      display: block;
    }
  </style>
</head>
<body>
  <h2>PR Generator Settings</h2>
  <div class="field">
    <label for="apiEndpoint">API Endpoint</label>
    <input type="text" id="apiEndpoint" placeholder="Set in config.local.json">
  </div>
  <div class="field">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="Set in config.local.json">
  </div>
  <div class="field">
    <label for="model">Model</label>
    <input type="text" id="model" placeholder="Set in config.local.json">
  </div>
  <button class="save-btn" id="saveBtn">Save</button>
  <div class="saved-msg" id="savedMsg">Settings saved!</div>
  <script src="popup.js"></script>
</body>
</html>
